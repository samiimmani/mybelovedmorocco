<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Contact - MY MOROCCO</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Arial', sans-serif;
            color: #333;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/2c/Flag_of_Morocco.svg') no-repeat center center fixed;
            background-size: cover;
        }
        .overlay {
            background-color: rgba(255, 255, 255, 0.9);
            min-height: 100vh;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            margin-top: 50px;
        }
        h1 {
            color: #bb2a26;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
        }
        input, textarea {
            padding: 10px;
            border: 2px solid #bb2a26;
            border-radius: 8px;
            font-size: 1em;
            resize: vertical;
        }
        button {
            background-color: #bb2a26;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #a52722;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            color: white;
        }
        a {
            color: #bb2a26;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Contact / Crédits</h1>
        <form action="#" method="post">
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" placeholder="Votre nom" required />

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required />

            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="6" placeholder="Votre message" required></textarea>

            <button type="submit">Envoyer</button>
        </form>

        <footer>
            &copy; 2025 MY MOROCCO - Site réalisé par toi !
            <br />
            <a href="index.html">Retour à l'accueil</a>
        </footer>
    </div>
</body>
</html>
